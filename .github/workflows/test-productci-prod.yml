name: Product API Production CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Start Product API
        env:
          MONGO_URI: mongodb://localhost:27017/productdb
          PORT: 3000
        run: |
          node server.js > server.log 2>&1 &
          sleep 5

      - name: Check API
        run: curl http://localhost:3000/

      - name: Test Create Product
        run: |
          curl -X POST http://localhost:3000/products \
          -H "Content-Type: application/json" \
          -d '{"pid":"P001","pname":"Laptop","price":15000000,"quantity":10}'

      - name: Test Read Products
        run: curl http://localhost:3000/products

      - name: Show API logs
        if: always()
        run: cat server.log