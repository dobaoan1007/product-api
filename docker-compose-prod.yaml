services:
  mongodb:
    image: mongo:latest
    container_name: anmongodb-prod
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-api:
    image: baoan100725/product-api:latest
    container_name: product-api-prod
    ports:
      - "3001:3000"
    environment:
      MONGO_URI: mongodb://anmongodb-prod:27017/productdb
      PORT: 3000
    depends_on:
      mongodb:
        condition: service_healthy